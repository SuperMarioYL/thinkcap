<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
     role="img" aria-label="架构：Coding Agent → thinkcap serve (:8088) → llama.cpp (:8080)，回流时 thinkcap 解析 think 轨迹并按预算注入 inception">
  <defs>
    <marker id="ah-l" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#B9B9C2"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="360" fill="#F5F5F7"/>

  <!-- 静态连线（底层）：上排=请求前向（向右），下排=响应回流（向左） -->
  <g stroke="#C9C9D0" stroke-width="1.5" fill="none">
    <line x1="210" y1="160" x2="350" y2="160" marker-end="url(#ah-l)"/>
    <line x1="525" y1="160" x2="668" y2="160" marker-end="url(#ah-l)"/>
    <line x1="668" y1="200" x2="525" y2="200" marker-end="url(#ah-l)"/>
    <line x1="350" y1="200" x2="210" y2="200" marker-end="url(#ah-l)"/>
  </g>

  <!-- 行军虚线数据流（顶层）：dasharray 周期=16，from 32→0=2 周期 → 无缝循环；
       请求段向右流（紫=agent），响应段向左流（绿=inference 回流） -->
  <g stroke-width="1.5" fill="none" stroke-linecap="round">
    <line x1="210" y1="160" x2="346" y2="160" stroke="#5E5CE6" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <line x1="525" y1="160" x2="664" y2="160" stroke="#0071E3" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-0.4s" repeatCount="indefinite"/>
    </line>
    <line x1="668" y1="200" x2="529" y2="200" stroke="#10A37F" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-0.8s" repeatCount="indefinite"/>
    </line>
    <line x1="350" y1="200" x2="214" y2="200" stroke="#5E5CE6" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-1.2s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- 数据包圆点沿连线流动（animateMotion） -->
  <g>
    <circle r="3" fill="#5E5CE6">
      <animateMotion path="M210,160 L346,160" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#0071E3">
      <animateMotion path="M525,160 L664,160" dur="2.4s" begin="-0.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#10A37F">
      <animateMotion path="M668,200 L529,200" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#5E5CE6">
      <animateMotion path="M350,200 L214,200" dur="2.4s" begin="-1.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 节点盒：紫=Agent/逻辑，蓝=基础设施/品牌(thinkcap)，绿=Inference(llama.cpp)；
       呼吸 = fill-opacity 0.10↔0.18 spline 缓动，三节点负 begin 错峰 -->
  <g>
    <rect x="40"  y="140" width="170" height="80" rx="15" fill="#5E5CE6" fill-opacity="0.10" stroke="#5E5CE6" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="125" y="180" text-anchor="middle" font-size="15" font-weight="600" fill="#4B3FC4">Coding Agent</text>
    <text x="125" y="200" text-anchor="middle" font-size="11" font-weight="500" fill="#6E6E73">Cline · Aider</text>

    <rect x="355" y="140" width="170" height="80" rx="15" fill="#0071E3" fill-opacity="0.10" stroke="#0071E3" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-1.1s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="440" y="178" text-anchor="middle" font-size="15" font-weight="600" fill="#0A4F9E">thinkcap serve</text>
    <text x="440" y="198" text-anchor="middle" font-size="11" font-weight="500" fill="#6E6E73">:8088 · governor</text>

    <rect x="670" y="140" width="170" height="80" rx="15" fill="#10A37F" fill-opacity="0.10" stroke="#10A37F" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-2.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="755" y="180" text-anchor="middle" font-size="15" font-weight="600" fill="#0B6B53">llama.cpp</text>
    <text x="755" y="200" text-anchor="middle" font-size="11" font-weight="500" fill="#6E6E73">:8080 · Qwen3.8</text>
  </g>

  <!-- 守门人动作注解（回流段 = 响应被解析、超标注入 inception） -->
  <text x="440" y="262" text-anchor="middle" font-size="12" font-weight="500" fill="#6E6E73">
    回流时 parse &lt;|im_start|&gt;think · 超预算即注入 inception 强制收敛
  </text>
  <text x="440" y="280" text-anchor="middle" font-size="11" font-weight="400" fill="#A1A1A8">
    上排 = 请求前向 · 下排 = 响应回流（守门人作用于此段）
  </text>
</svg>

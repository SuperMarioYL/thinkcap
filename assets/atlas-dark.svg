<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
     role="img" aria-label="架构：Coding Agent → thinkcap serve (:8088) → llama.cpp (:8080)，回流时 thinkcap 解析 think 轨迹并按预算注入 inception">
  <defs>
    <marker id="ah-d" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5A5A66"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="360" fill="#1D1D1F"/>

  <g stroke="#3A3A44" stroke-width="1.5" fill="none">
    <line x1="210" y1="160" x2="350" y2="160" marker-end="url(#ah-d)"/>
    <line x1="525" y1="160" x2="668" y2="160" marker-end="url(#ah-d)"/>
    <line x1="668" y1="200" x2="525" y2="200" marker-end="url(#ah-d)"/>
    <line x1="350" y1="200" x2="210" y2="200" marker-end="url(#ah-d)"/>
  </g>

  <g stroke-width="1.5" fill="none" stroke-linecap="round">
    <line x1="210" y1="160" x2="346" y2="160" stroke="#8985FF" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <line x1="525" y1="160" x2="664" y2="160" stroke="#4DA3FF" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-0.4s" repeatCount="indefinite"/>
    </line>
    <line x1="668" y1="200" x2="529" y2="200" stroke="#2DC79A" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-0.8s" repeatCount="indefinite"/>
    </line>
    <line x1="350" y1="200" x2="214" y2="200" stroke="#8985FF" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-1.2s" repeatCount="indefinite"/>
    </line>
  </g>

  <g>
    <circle r="3" fill="#8985FF">
      <animateMotion path="M210,160 L346,160" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#4DA3FF">
      <animateMotion path="M525,160 L664,160" dur="2.4s" begin="-0.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#2DC79A">
      <animateMotion path="M668,200 L529,200" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#8985FF">
      <animateMotion path="M350,200 L214,200" dur="2.4s" begin="-1.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g>
    <rect x="40"  y="140" width="170" height="80" rx="15" fill="#8985FF" fill-opacity="0.16" stroke="#8985FF" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.16;0.24;0.16" keyTimes="0;0.5;1" dur="3.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="125" y="180" text-anchor="middle" font-size="15" font-weight="600" fill="#C3C1FF">Coding Agent</text>
    <text x="125" y="200" text-anchor="middle" font-size="11" font-weight="500" fill="#A1A1A8">Cline · Aider</text>

    <rect x="355" y="140" width="170" height="80" rx="15" fill="#4DA3FF" fill-opacity="0.16" stroke="#4DA3FF" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.16;0.24;0.16" keyTimes="0;0.5;1" dur="3.2s" begin="-1.1s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="440" y="178" text-anchor="middle" font-size="15" font-weight="600" fill="#9CC7FF">thinkcap serve</text>
    <text x="440" y="198" text-anchor="middle" font-size="11" font-weight="500" fill="#A1A1A8">:8088 · governor</text>

    <rect x="670" y="140" width="170" height="80" rx="15" fill="#2DC79A" fill-opacity="0.16" stroke="#2DC79A" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.16;0.24;0.16" keyTimes="0;0.5;1" dur="3.2s" begin="-2.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="755" y="180" text-anchor="middle" font-size="15" font-weight="600" fill="#7CE4BE">llama.cpp</text>
    <text x="755" y="200" text-anchor="middle" font-size="11" font-weight="500" fill="#A1A1A8">:8080 · Qwen3.8</text>
  </g>

  <text x="440" y="262" text-anchor="middle" font-size="12" font-weight="500" fill="#A1A1A8">
    回流时 parse &lt;|im_start|&gt;think · 超预算即注入 inception 强制收敛
  </text>
  <text x="440" y="280" text-anchor="middle" font-size="11" font-weight="400" fill="#6E6E73">
    上排 = 请求前向 · 下排 = 响应回流（守门人作用于此段）
  </text>
</svg>

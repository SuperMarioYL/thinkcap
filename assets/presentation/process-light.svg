<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="465" viewBox="0 0 1000 465" data-palette="e6c956-bde76a-f6ccac-2f627a37f61f" role="img" aria-labelledby="process-light-title process-light-desc"><title id="process-light-title">thinkcap process</title><desc id="process-light-desc">Mock profiling emits five policy classes; a synthetic open think block crosses the budget and the closed block does not trigger.</desc><defs><linearGradient id="brand" gradientUnits="userSpaceOnUse" x2="1000" y2="465"><stop stop-color="#847331"/><stop offset=".6" stop-color="#657c39"/><stop offset="1" stop-color="#86705e"/></linearGradient><radialGradient id="halo"><stop stop-color="#847331" stop-opacity=".22"/><stop offset="1" stop-color="#fefdf9" stop-opacity="0"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="5"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#f7eecb" stroke-opacity=".35" stroke-width=".6"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#847331" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,"Noto Sans",sans-serif}.flow{stroke-dasharray:10 110;animation:flow 6s linear infinite}.pulse{animation:pulse 5s ease-in-out infinite}.turn{transform-box:fill-box;transform-origin:center;animation:turn 36s linear infinite}@keyframes flow{to{stroke-dashoffset:-360}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes turn{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transform:none!important}.flow{display:none}}</style><rect width="1000" height="465" rx="16" fill="#fefdf9"/><rect width="1000" height="465" rx="16" fill="url(#grid)"/><ellipse cx="630.0" cy="199.95" rx="500.0" ry="325.5" fill="url(#halo)"/><text x="44" y="44" fill="#72756b" font-size="13" text-anchor="start" font-weight="400">PROCESS / FROM INPUT TO RESULT</text><text x="44" y="84.0" fill="#27261c" font-size="30" text-anchor="start" font-weight="400">From input to a useful result</text><path d="M332.0 237H356.0" fill="none" stroke="#847331" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M332.0 237H356.0" class="flow" fill="none" stroke="#86705e" stroke-width="2"/><rect x="44.0" y="176" width="288.0" height="122" rx="12" fill="#fefcf7" stroke="#f7eecb"/><text x="62.0" y="207.0" fill="#27261c" font-size="21" text-anchor="start" font-weight="400">01  Profile canned</text><text x="62.0" y="236.4" fill="#27261c" font-size="21" text-anchor="start" font-weight="400">traces</text><text x="62.0" y="259.0" fill="#72756b" font-size="17" text-anchor="start" font-weight="400">Five policy classes</text><path d="M644.0 237H668.0" fill="none" stroke="#847331" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M644.0 237H668.0" class="flow" fill="none" stroke="#86705e" stroke-width="2"/><rect x="356.0" y="176" width="288.0" height="122" rx="12" fill="#fefcf7" stroke="#f7eecb"/><text x="374.0" y="207.0" fill="#27261c" font-size="21" text-anchor="start" font-weight="400">02  Feed split</text><text x="374.0" y="236.4" fill="#27261c" font-size="21" text-anchor="start" font-weight="400">delimiter</text><text x="374.0" y="259.0" fill="#72756b" font-size="17" text-anchor="start" font-weight="400">80 synthetic think bytes</text><rect x="668.0" y="176" width="288.0" height="122" rx="12" fill="#fefcf7" stroke="#f7eecb"/><text x="686.0" y="207.0" fill="#27261c" font-size="21" text-anchor="start" font-weight="400">03  Evaluate</text><text x="686.0" y="236.4" fill="#27261c" font-size="21" text-anchor="start" font-weight="400">threshold</text><text x="686.0" y="259.0" fill="#72756b" font-size="17" text-anchor="start" font-weight="400">True inside, false after</text><text x="686.0" y="282.8" fill="#72756b" font-size="17" text-anchor="start" font-weight="400">close</text><text x="44" y="379.0" fill="#86705e" font-size="20" text-anchor="start" font-weight="400">Mock profiling emits five policy classes; a synthetic open think block crosses</text><text x="44" y="407.0" fill="#86705e" font-size="20" text-anchor="start" font-weight="400">the budget and the closed block does not trigger.</text></svg>
